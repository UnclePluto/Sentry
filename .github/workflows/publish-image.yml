name: 发布 ACR 镜像
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-acr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: crpi-vu9eu0iguupfgpzi.cn-guangzhou.personal.cr.aliyuncs.com
      IMAGE: crpi-vu9eu0iguupfgpzi.cn-guangzhou.personal.cr.aliyuncs.com/dypluto/sentry
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_PASSWORD: sentry-ci-only, POSTGRES_DB: sentry_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:sentry-ci-only@127.0.0.1:5432/sentry_test
      - name: 检查 ACR 凭据
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: test -n "$ACR_PASSWORD" || { echo '请配置仓库 Secret ACR_PASSWORD'; exit 1; }
      - name: 登录 ACR
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login --username dypluto --password-stdin "$REGISTRY"
      - uses: docker/setup-buildx-action@v4
      - name: 构建并发布固定版本
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建并发布数据库备份镜像
        uses: docker/build-push-action@v7
        with:
          context: deploy/postgres
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:postgres-sha-${{ github.sha }}
      - name: 记录镜像版本
        run: printf '镜像：%s:sha-%s\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 退出 ACR
        if: always()
        run: docker logout "$REGISTRY"
