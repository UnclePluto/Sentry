name: 检查与构建
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_PASSWORD: sentry-ci-only, POSTGRES_DB: sentry_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:sentry-ci-only@127.0.0.1:5432/sentry_test
      - run: npm run build
